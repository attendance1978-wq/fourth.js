<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Engine Library - Complete Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 12px;
            color: white;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        #ui h1 {
            font-size: 18px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        
        #ui p {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 5px;
        }
        
        #controls-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 10px 18px;
            border-radius: 8px;
            color: #ccc;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        #controls-panel span {
            color: #ffaa66;
        }
        
        .badge {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 12px;
            border-radius: 20px;
            color: #888;
            font-size: 11px;
            font-family: monospace;
            pointer-events: none;
        }
        
        @media (max-width: 768px) {
            #ui { padding: 10px 18px; }
            #ui h1 { font-size: 14px; }
            #controls-panel { font-size: 9px; bottom: 10px; left: 10px; }
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>🎮 3D Engine Library</h1>
        <p>Complete JavaScript 3D Engine | Software Renderer | Orbit Controls</p>
    </div>
    <div id="controls-panel">
        🖱️ <span>Left Drag</span>: Rotate | <span>Right Drag</span>: Pan | <span>Scroll</span>: Zoom
    </div>
    <div class="badge">
        Built with Vanilla JS | Cube + Sphere + Torus + Cylinder
    </div>

    <script type="module">
        import { GraphicsEngine3D } from './main.js';
        import { MeshFactory, Colors } from './fourth.js';

        // Initialize the 3D engine
        const engine = new GraphicsEngine3D('canvas-container');
        
        // Create a central rotating cube with neon color
        const centerCube = MeshFactory.createBox(1.0, 1.0, 1.0, '#ff3366');
        centerCube.position.set(0, 0, 0);
        engine.addAnimated(centerCube, { 
            rotateY: true, 
            rotateX: true, 
            speed: 1.2,
            bob: false
        });
        
        // Create a sphere that bobs up and down
        const sphere = MeshFactory.createSphere(0.7, '#33ff66', { segments: 48 });
        sphere.position.set(-2.2, 0, 0);
        sphere.originalY = 0;
        engine.addAnimated(sphere, { 
            rotateY: true, 
            speed: 0.8, 
            bob: true, 
            bobHeight: 0.4,
            bobSpeed: 1.5
        });
        
        // Create a cylinder
        const cylinder = MeshFactory.createCylinder(0.6, 0.6, 1.3, '#ffaa33');
        cylinder.position.set(2.2, 0, 0);
        engine.addAnimated(cylinder, { 
            rotateY: true, 
            speed: 1.0,
            bob: false
        });
        
        // Create a torus (donut shape)
        const torus = MeshFactory.createTorus(0.9, 0.25, 48, 96, '#ff66cc');
        torus.position.set(0, 1.5, -1.2);
        engine.addAnimated(torus, { 
            rotateY: true, 
            rotateX: true, 
            speed: 0.9,
            bob: true,
            bobHeight: 0.2,
            bobSpeed: 1.2
        });
        
        // Create a second smaller cube
        const smallCube = MeshFactory.createBox(0.6, 0.6, 0.6, '#44aaff');
        smallCube.position.set(-1.5, 1.2, 1.5);
        engine.addAnimated(smallCube, { 
            rotateY: true, 
            rotateX: true, 
            speed: 1.5,
            bob: true,
            bobHeight: 0.25,
            bobSpeed: 1.8
        });
        
        // Create a pyramid-like shape using cylinder with different radii
        const pyramid = MeshFactory.createCylinder(0, 0.8, 1.2, '#ff9944');
        pyramid.position.set(1.8, -0.5, 1.8);
        engine.addAnimated(pyramid, { 
            rotateY: true, 
            speed: 0.7,
            bob: false
        });
        
        // Create a wireframe ground reference
        const groundPlane = MeshFactory.createPlane(6, 6, '#88aaff', { wireframe: true });
        groundPlane.position.set(0, -1.2, 0);
        engine.addMesh(groundPlane);
        
        // Add some floating particles (small cubes)
        for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI * 2;
            const radius = 2.8;
            const particle = MeshFactory.createBox(0.15, 0.15, 0.15, Colors.random());
            particle.position.set(Math.cos(angle) * radius, Math.sin(angle * 2) * 0.8 + 0.5, Math.sin(angle) * radius);
            engine.addAnimated(particle, { 
                rotateY: true, 
                speed: 0.5 + i * 0.1,
                bob: true,
                bobHeight: 0.15,
                bobSpeed: 1.0 + i * 0.2
            });
        }
        
        console.log('🚀 3D Engine Demo Running!');
        console.log('Engine features: Software rasterizer, depth buffer, lighting, orbit controls');
    </script>
</body>
</html>
