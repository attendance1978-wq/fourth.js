<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Engine - Fixed</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            z-index: 10;
            pointer-events: none;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.5);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">
        ✨ 3D Engine Library | Working Demo
    </div>
    <div id="controls">
        🖱️ Left Drag: Rotate | Right Drag: Pan | Scroll: Zoom
    </div>

    <script type="module">
        import { GraphicsEngine3D } from './main.js';
        import { MeshFactory, Colors } from './fourth.js';

        console.log('Starting 3D Engine...');
        
        const engine = new GraphicsEngine3D('canvas-container');
        
        // Create a rotating cube
        const cube = MeshFactory.createBox(1, 1, 1, '#ff3366');
        cube.position.set(-1.5, 0, 0);
        engine.addAnimated(cube, { rotateY: true, speed: 1.2 });
        
        // Create a sphere
        const sphere = MeshFactory.createSphere(0.7, '#33ff66');
        sphere.position.set(1.5, 0.2, 0);
        engine.addAnimated(sphere, { rotateY: true, bob: true, bobHeight: 0.3 });
        
        // Create a cylinder
        const cylinder = MeshFactory.createCylinder(0.5, 0.5, 1.2, '#ffaa33');
        cylinder.position.set(0, 0, 1.8);
        engine.addAnimated(cylinder, { rotateY: true, speed: 0.8 });
        
        console.log('Objects added:', engine.objects.length);
    </script>
</body>
</html>
